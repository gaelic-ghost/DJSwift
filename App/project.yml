name: DJSwift
options:
  minimumXcodeGenVersion: 2.45.0
  bundleIdPrefix: com.galewilliams
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
configs:
  Debug: debug
  Release: release
targets:
  DJSwift_iOS:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/DJSwiftApp
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchScreen.storyboard
    configFiles:
      Debug: Configuration/iOS-Debug.xcconfig
      Release: Configuration/iOS-Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: DJSwift
        PRODUCT_BUNDLE_IDENTIFIER: com.galewilliams.DJSwift.iOS
        TARGETED_DEVICE_FAMILY: "1,2"
  DJSwift_macOS:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/DJSwiftApp
      - path: Resources/Assets.xcassets
    configFiles:
      Debug: Configuration/macOS-Debug.xcconfig
      Release: Configuration/macOS-Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: DJSwift
        PRODUCT_BUNDLE_IDENTIFIER: com.galewilliams.DJSwift.macOS
schemes:
  DJSwift_iOS:
    build:
      targets:
        DJSwift_iOS: all
    run:
      config: Debug
    archive:
      config: Release
  DJSwift_macOS:
    build:
      targets:
        DJSwift_macOS: all
    run:
      config: Debug
    archive:
      config: Release
