openapi: 3.1.0
info:
  title: DJSwift API
  version: 0.1.0
  description: Contract for DJSwift health, station metadata, and station manifests.
servers:
  - url: http://127.0.0.1:8080
    description: Local development server
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/stations:
    get:
      operationId: listStations
      responses:
        "200":
          description: All available stations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationList"
  /api/v1/stations/{stationSlug}:
    parameters:
      - $ref: "#/components/parameters/StationSlug"
    get:
      operationId: getStation
      responses:
        "200":
          description: The requested station.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Station"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/stations/{stationSlug}/manifest:
    parameters:
      - $ref: "#/components/parameters/StationSlug"
    get:
      operationId: getStationManifest
      responses:
        "200":
          description: The current playable station manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationManifest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    StationSlug:
      name: stationSlug
      in: path
      required: true
      description: Stable station slug.
      schema:
        type: string
  responses:
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string }
        service: { type: string }
    Station:
      type: object
      required: [id, slug, name, tagline]
      properties:
        id: { type: string, format: uuid }
        slug:
          type: string
          description: Stable public identifier used in station URLs.
        name: { type: string }
        tagline: { type: string }
    StationList:
      type: object
      required: [stations]
      properties:
        stations:
          type: array
          items: { $ref: "#/components/schemas/Station" }
    StationManifest:
      type: object
      required: [id, stationId, revision, generatedAt, validFrom, validThrough, items]
      properties:
        id: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        revision: { type: integer, format: int64 }
        generatedAt: { type: string, format: date-time }
        validFrom: { type: string, format: date-time }
        validThrough: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/ManifestItem" }
    ManifestItem:
      type: object
      required: [id, title, startsAt, source]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        durationSeconds: { type: integer }
        source: { $ref: "#/components/schemas/ManifestSource" }
    ManifestSource:
      oneOf:
        - $ref: "#/components/schemas/TrackReference"
        - $ref: "#/components/schemas/AudioAssetReference"
    PlaybackProvider:
      type: string
      enum: [appleMusic, spotify]
    TrackReference:
      type: object
      required: [kind, provider, catalogId]
      properties:
        kind: { type: string, enum: [track] }
        provider: { $ref: "#/components/schemas/PlaybackProvider" }
        catalogId: { type: string }
        market: { type: string }
    AudioAssetReference:
      type: object
      required: [kind, assetId, mediaUrl]
      properties:
        kind: { type: string, enum: [audioAsset] }
        assetId: { type: string, format: uuid }
        mediaUrl: { type: string, format: uri }
    Program:
      type: object
      required: [id, stationId, name, summary]
      properties:
        id: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        name: { type: string }
        summary: { type: string }
    Weekday:
      type: integer
      enum: [1, 2, 3, 4, 5, 6, 7]
      description: Calendar weekday where Sunday is 1 and Saturday is 7.
    ScheduleRule:
      type: object
      required: [id, programId, timeZoneIdentifier, weekdays, startMinuteOfDay, durationMinutes, priority]
      properties:
        id: { type: string, format: uuid }
        programId: { type: string, format: uuid }
        timeZoneIdentifier:
          type: string
          description: IANA time zone identifier, such as America/New_York.
        weekdays:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: "#/components/schemas/Weekday" }
        startMinuteOfDay:
          type: integer
          minimum: 0
          maximum: 1439
        durationMinutes:
          type: integer
          minimum: 1
        priority:
          type: integer
          default: 0
    APIError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
